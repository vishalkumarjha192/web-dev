
<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Socket.IO Client</title>

  <script src="https://cdn.socket.io/4.8.4/socket.io.min.js"></script>
</head>

<body>
  <h1>Welcome to Socket.IO Client Side</h1>

  <script>
    // Connect to Socket.IO server
    const socket = io("http://localhost:8080", {
      transports: ["websocket"]
    });

    // Connection event
    socket.on("connect", () => {
      console.log("Connected to server:", socket.id);

      // Sending message to server
      socket.emit("kuchbhi", "Welcome to client side");
    });

    // Receiving message from server
    socket.on("gyankibaat", (msg) => {
      console.log("Message from server:", msg);
    });

    // Receiving notification when another user joins
    socket.on("join", (msg) => {
      console.log(msg);
    });

    // Error handling
    socket.on("connect_error", (error) => {
      console.log("Connection error:", error.message);
    });

    // Disconnect event
    socket.on("disconnect", (reason) => {
      console.log("Disconnected:", reason);
    });
  </script>
</body>
</html>
